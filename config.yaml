# quantbot configuration. Non-secret settings live here; secrets live in .env.

report:
  # Currency to display totals in. Base currency of the IBKR account is used for
  # position values; set this to that currency to avoid FX conversion for now.
  base_currency: USD
  timezone: Singapore       # used for the "as of" timestamp in the report

  # Delivery of the daily brief:
  #   html  — send the self-contained styled HTML as a Telegram document; tap it to
  #           open full-quality in Telegram's in-app browser (recommended)
  #   text  — plain Telegram HTML message only
  delivery: html
  reports_dir: data/reports # where each day's .html brief is archived

# Data providers. Swap free -> paid here without touching analysis code.
providers:
  broker: ibkr_flex
  market_data:
    prices: yfinance                # yfinance | (future) fmp | polygon
    fundamentals: yfinance          # yfinance | (future) fmp | finnhub_paid
    earnings: finnhub               # finnhub | (future) fmp
    macro: fred                     # fred (authoritative, free)
    econ_calendar: finnhub          # finnhub | (future) fmp
    news: finnhub                   # finnhub (free company-news) | (blank to disable)

# Rolling window (calendar days) of daily prices to pull for TA / risk math.
history_days: 400

# Benchmark for relative performance (alpha / regressed beta / capture). Free via the
# existing price provider. Optional `targets` = your intended weights (fractions); when
# set, the brief flags positions that have drifted past `drift_tolerance` from target.
benchmark:
  symbol: SPY
  drift_tolerance: 0.05             # flag drift >= 5 percentage points from target
  # targets:
  #   SLV: 0.30
  #   IBIT: 0.20

# Event radar: forward earnings + macro calendar, weighted by your exposure, plus a
# rates-sensitivity beta regressed from prices already pulled. The rate proxy is a bond
# ETF fetched via the price provider (free); a name whose |beta| to it clears the
# threshold counts toward your rate-exposed share.
events:
  horizon_days: 14                  # how far forward to scan for earnings + macro events
  rate_proxy: TLT                   # bond ETF used as the rates proxy for beta
  rate_beta_threshold: 0.20         # |beta| to the proxy above which a name is rate-sensitive

# Driver attribution: for each of the day's notable movers, split the move into the part
# its "theme" explains (beta x theme return) and the name-specific residual — so the brief
# can say *why* a name moved, not just that it did. Each theme ticker is pulled free via the
# price provider; unmapped names fall back to `default`. For abnormal single-stock movers,
# recent headlines are attached as *possible* (unconfirmed) catalysts via the news provider.
drivers:
  default:                          # any name without an explicit mapping below
    ticker: SPY
    theme: the broad market
  max_movers: 5                     # cap on how many movers get an attribution line
  map:
    SLV:  {ticker: "SI=F",   theme: silver}
    IBIT: {ticker: "BTC-USD", theme: bitcoin}
    META: {ticker: XLC,      theme: comm-services}
    FIG:  {ticker: IGV,      theme: software}

# Scenario stress test: translate the book's risk into dollar impact under named shocks.
# Market shocks are applied through the portfolio's beta; the rate shock through its
# regressed beta to the rate proxy above (events.rate_proxy). Historical worst-day /
# worst-week and CVaR (expected shortfall) are replayed from the price window already
# pulled — no new data. Shocks are fractions.
stress:
  market_shocks: [-0.05, -0.10]     # e.g. SPY -5% / -10%, beta-scaled to your book
  rate_shocks: [-0.05]              # a move in the rate proxy (bond selloff = rising rates)

# Macro series to report (FRED series IDs).
macro_series:
  cpi: CPIAUCSL                     # CPI, all urban consumers
  core_cpi: CPILFESL                # CPI less food & energy
  unemployment: UNRATE
  fed_funds: FEDFUNDS
  ten_year: DGS10

# Risk profile / flag thresholds. These encode YOUR tolerance — tune freely.
risk:
  concentration_pct: 25.0           # single position > this % of book -> CONCENTRATION
  sector_pct: 40.0                  # single sector  > this % of book -> SECTOR_OVERWEIGHT
  portfolio_beta_high: 1.3          # weighted beta above this -> HIGH_BETA
  rsi_overbought: 70.0
  rsi_oversold: 30.0
  earnings_soon_days: 5             # earnings within N days -> EARNINGS_SOON
  drawdown_pct: 15.0                # down > this % from recent high -> DRAWDOWN
  var_confidence: 0.95              # historical VaR confidence level
  risk_free_rate: 0.04             # annual, for Sharpe
  cluster_corr: 0.70                # holdings correlated >= this group into one cluster

narrative:
  enabled: true
  model: claude-sonnet-5            # claude-sonnet-5 (cheaper) | claude-opus-5
  max_tokens: 900
