[project]
name = "quantbot"
version = "0.1.0"
description = "Personal quant bot: pulls IBKR portfolio, runs FA/TA/risk analysis, sends a morning brief to Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "fredapi>=0.5.1",
    "finnhub-python>=2.4",
    "anthropic>=0.40",
    "APScheduler>=3.10,<4",  # in-container cron for the daily run (deploy/Dockerfile)
    "tzdata>=2024.1",  # zoneinfo database for slim/Alpine images without system tz data
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
quantbot = "quantbot.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# 120 matches how the codebase is actually written (prose docstrings and f-strings
# routinely land in the 100–120 range).
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Explicit contract (ruff's defaults have expanded over versions — pin it so CI is
# stable): pycodestyle, pyflakes, import sorting, pyupgrade, bugbear.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS/HTML template literals can't be wrapped without breaking the markup.
"src/quantbot/report/html.py" = ["E501"]
