# Serves the per-day HTML briefs written by quantbot into the shared data volume.
# The pipeline writes them to /app/data/reports; this container mounts that same
# volume read-only at /srv/reports.
server {
    listen 80;
    server_name _;

    root /srv/reports;
    index index.html;
    autoindex on;               # a simple directory listing of past briefs
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Briefs are immutable once written; let clients cache them.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
